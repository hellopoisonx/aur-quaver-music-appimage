name: Update package

# Runs update.sh against the newest upstream release, commits PKGBUILD/.SRCINFO
# here and pushes the same commit to AUR. Needs the AUR_SSH_PRIVATE_KEY secret
# (private half of a key registered on your AUR account).
on:
  schedule:
    # No cross-repo release events: poll upstream once a day.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream release to package (empty = latest stable)'
        required: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # makepkg refuses to run as root; switch to a user with the runner's uid
      # so the files it writes stay owned by the runner.
      - name: Run update.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e GITHUB_TOKEN \
            archlinux:base-devel bash -euc "
              pacman -Syu --noconfirm --needed git jq >/dev/null
              useradd -m -u $(id -u) builder
              su -s /bin/bash builder -c './update.sh $VERSION'
            "

      - name: Commit
        id: commit
        run: |
          if git diff --quiet -- PKGBUILD .SRCINFO; then exit 0; fi
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -qm "update: $(sed -n 's/^pkgver=//p' PKGBUILD)" -- PKGBUILD .SRCINFO
          echo changed=true >> "$GITHUB_OUTPUT"

      - name: Push to GitHub
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:master

      # AUR rejects subdirectories and its history must stay flat, so it gets
      # only PKGBUILD/.SRCINFO, in a commit built on a fresh clone instead of
      # ours. Running it unconditionally also retries a sync that previously
      # committed but failed to push.
      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z $AUR_SSH_PRIVATE_KEY ]]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is empty - store it as a repository secret"; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          git clone -q ssh://aur@aur.archlinux.org/quaver-music-appimage.git "$RUNNER_TEMP/aur"
          cd "$RUNNER_TEMP/aur"
          cp "$GITHUB_WORKSPACE/PKGBUILD" "$GITHUB_WORKSPACE/.SRCINFO" .
          if git diff --quiet; then exit 0; fi
          git -c user.name="${GITHUB_ACTOR}" \
              -c user.email="${GITHUB_ACTOR}@users.noreply.github.com" \
              commit -qm "update: $(sed -n 's/^pkgver=//p' PKGBUILD)" -- PKGBUILD .SRCINFO
          git push -q origin HEAD:master
